<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13cent Hub Empire</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0057ff;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
}

.search{
width:45%;
padding:10px;
border:none;
border-radius:8px;
}

.hero{
background:linear-gradient(135deg,#0057ff,#0099ff);
color:white;
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:42px;
}

.hero p{
margin-top:15px;
font-size:20px;
}

.btn{
display:inline-block;
margin-top:25px;
background:white;
color:#0057ff;
padding:14px 25px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.products{
padding:40px 20px;
}

.products h2{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
border-radius:10px;
}

.price{
color:#0057ff;
font-size:22px;
font-weight:bold;
margin-top:10px;
}

footer{
margin-top:50px;
background:#111;
color:white;
padding:25px;
text-align:center;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 18px;
border-radius:50%;
text-decoration:none;
font-size:22px;
}
</style>

</head>

<body>

<header>

<div class="logo">
13cent Hub Empire
</div>

<input class="search" placeholder="Search phones...">

</header>

<section class="hero">

<h1>Premium Phones & Accessories</h1>

<p>Your trusted gadget store in Nigeria.</p>

<a href="#" class="btn">
Shop Now
</a>

</section>

<section class="products">

<h2>Featured Phones</h2>

<div class="grid">

<div class="card">

<img src="https://via.placeholder.com/250x250">

<h3>iPhone 15 Pro Max</h3>

<div class="price">
₦1,850,000
</div>

</div>

<div class="card">

<img src="https://via.placeholder.com/250x250">

<h3>Samsung S24 Ultra</h3>

<div class="price">
₦1,600,000
</div>

</div>

<div class="card">

<img src="https://via.placeholder.com/250x250">

<h3>Redmi Note 14</h3>

<div class="price">
₦380,000
</div>

</div>

</div>

</section>

<footer>

© 2026 13cent Hub Empire

<br><br>

Premium Phones & Accessories

</footer>

<a class="whatsapp" href="#">
💬
</a>

</body>
</html>
